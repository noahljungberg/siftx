[package]
name = "siftx-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

# The targets fuzz each parser directly, and the parser modules are private
# unless `internals` is on - see the note in src/lib.rs.
[dependencies.siftx]
package = "truespar-siftx"
path = ".."
features = ["internals"]

# One target per format family, plus a catch-all auto-detect target.

[[bin]]
name = "fuzz_read"
path = "fuzz_targets/fuzz_read.rs"
doc = false

[[bin]]
name = "fuzz_jpeg"
path = "fuzz_targets/fuzz_jpeg.rs"
doc = false

[[bin]]
name = "fuzz_tiff"
path = "fuzz_targets/fuzz_tiff.rs"
doc = false

[[bin]]
name = "fuzz_png"
path = "fuzz_targets/fuzz_png.rs"
doc = false

[[bin]]
name = "fuzz_pdf"
path = "fuzz_targets/fuzz_pdf.rs"
doc = false

[[bin]]
name = "fuzz_webp"
path = "fuzz_targets/fuzz_webp.rs"
doc = false

[[bin]]
name = "fuzz_heif"
path = "fuzz_targets/fuzz_heif.rs"
doc = false

[[bin]]
name = "fuzz_gif"
path = "fuzz_targets/fuzz_gif.rs"
doc = false

[[bin]]
name = "fuzz_bmp"
path = "fuzz_targets/fuzz_bmp.rs"
doc = false

[[bin]]
name = "fuzz_quicktime"
path = "fuzz_targets/fuzz_quicktime.rs"
doc = false

[[bin]]
name = "fuzz_xmp"
path = "fuzz_targets/fuzz_xmp.rs"
doc = false

[[bin]]
name = "fuzz_iptc"
path = "fuzz_targets/fuzz_iptc.rs"
doc = false

[[bin]]
name = "fuzz_icc"
path = "fuzz_targets/fuzz_icc.rs"
doc = false

[workspace]
members = ["."]
