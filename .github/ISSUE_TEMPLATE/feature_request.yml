name: Feature request
description: Support for a format, tag, or capability SiftX does not have yet
labels: [enhancement]
body:
  - type: textarea
    id: what
    attributes:
      label: What you would like SiftX to do
    validations: {required: true}
  - type: textarea
    id: why
    attributes:
      label: What you are trying to accomplish
      description: >
        The underlying goal, not just the proposed feature - there may be a way
        to do it already, or a better shape for the API.
    validations: {required: true}
  - type: input
    id: spec
    attributes:
      label: Specification or documentation, if you know of one
      description: >
        SiftX is a clean-room implementation, so a link to the format spec is
        far more useful than a link to another project's source.
