<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 50" width="170" height="50" role="img" aria-label="SiftX">
  <title>SiftX</title>
  <!-- Generated from the block wordmark:
      ## # ### ### # #
     #   # #    #  # #
     ##  # ###  #   # 
       # # #    #  # #
     ### # #    #  # #
       Drawn as rects rather than shipped as text because GitHub applies a
       line-height to <pre> and strips style attributes, so block characters
       cannot tile there and the rows separate. -->
  <g fill="#1f2328" shape-rendering="crispEdges">
    <rect x="10" y="0" width="20" height="10"/>
    <rect x="40" y="0" width="10" height="10"/>
    <rect x="60" y="0" width="30" height="10"/>
    <rect x="100" y="0" width="30" height="10"/>
    <rect x="140" y="0" width="10" height="10"/>
    <rect x="160" y="0" width="10" height="10"/>
    <rect x="0" y="10" width="10" height="10"/>
    <rect x="40" y="10" width="10" height="10"/>
    <rect x="60" y="10" width="10" height="10"/>
    <rect x="110" y="10" width="10" height="10"/>
    <rect x="140" y="10" width="10" height="10"/>
    <rect x="160" y="10" width="10" height="10"/>
    <rect x="0" y="20" width="20" height="10"/>
    <rect x="40" y="20" width="10" height="10"/>
    <rect x="60" y="20" width="30" height="10"/>
    <rect x="110" y="20" width="10" height="10"/>
    <rect x="150" y="20" width="10" height="10"/>
    <rect x="20" y="30" width="10" height="10"/>
    <rect x="40" y="30" width="10" height="10"/>
    <rect x="60" y="30" width="10" height="10"/>
    <rect x="110" y="30" width="10" height="10"/>
    <rect x="140" y="30" width="10" height="10"/>
    <rect x="160" y="30" width="10" height="10"/>
    <rect x="0" y="40" width="30" height="10"/>
    <rect x="40" y="40" width="10" height="10"/>
    <rect x="60" y="40" width="10" height="10"/>
    <rect x="110" y="40" width="10" height="10"/>
    <rect x="140" y="40" width="10" height="10"/>
    <rect x="160" y="40" width="10" height="10"/>
  </g>
</svg>
